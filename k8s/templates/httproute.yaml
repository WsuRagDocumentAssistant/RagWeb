{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rag-web-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.existingGatewayName }}
      namespace: {{ .Release.Namespace }}
      {{- if .Values.gateway.existingGatewaySectionName }}
      sectionName: {{ .Values.gateway.existingGatewaySectionName }}
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rag-web
          port: {{ .Values.service.port }}
{{- end }}